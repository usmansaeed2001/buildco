# Cloud Build: staff-web -> Firebase Hosting. Submitted by the Release workflow
# (.github/workflows/release.yml) for a commit on `main` whenever apps/staff-web/**,
# firebase.json or .firebaserc changed since the last release.
#
# Run it by hand against the current checkout with:
#   gcloud builds submit --config=apps/staff-web/cloudbuild.yaml \
#     --substitutions=_VERSION=X.Y.Z .
#
# _VERSION is the release number without the `v`. Left out, the bundle says `dev`.

steps:
  - id: install
    name: node:24
    dir: apps/staff-web
    args: ['npm', 'ci']

  # Typecheck and unit tests before the build, for the same reason as the API: a release
  # deploys with nobody watching the steps. `npm run build` runs `tsc -b` itself,
  # so a type error would stop the build anyway - the tests are the part that would not.
  - id: test
    name: node:24
    dir: apps/staff-web
    args: ['npm', 'run', 'test']
    waitFor: ['install']

  # Vite inlines VITE_* at BUILD time from .env.production, which is committed
  # precisely so this step has them. Without it the bundle ships with no Firebase
  # config and silently redirects every user to /setup.
  #
  # The version is the one value that cannot live in that file, because it is not known
  # until a release is cut. It arrives through the environment, which Vite reads too.
  - id: build
    name: node:24
    dir: apps/staff-web
    args: ['npm', 'run', 'build']
    env: ['VITE_APP_VERSION=${_VERSION}']
    waitFor: ['test']

  # Runs from the repo root, where firebase.json and .firebaserc live.
  #
  # Authenticates through Application Default Credentials from the build service
  # account - no FIREBASE_TOKEN. CI tokens are deprecated and would mean a long-lived
  # credential sitting in a build config or a secret. The build SA needs
  # roles/firebasehosting.admin.
  #
  # firebase-tools is pinned: an unpinned `npx firebase-tools` picks up whatever major
  # version published most recently, which is not a thing to discover during a deploy.
  - id: deploy
    name: node:24
    entrypoint: npx
    args:
      - '--yes'
      - 'firebase-tools@15'
      - 'deploy'
      - '--only'
      - 'hosting:staff'
      - '--project'
      - '${PROJECT_ID}'
      - '--non-interactive'
    waitFor: ['build']

substitutions:
  _VERSION: dev

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
