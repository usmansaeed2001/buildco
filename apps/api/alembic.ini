# Alembic configuration.
#
# The database URL is NOT set here — alembic/env.py reads it from app settings, so
# there is exactly one place a connection string is configured and no credential ever
# lands in a tracked file.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# Revision files are prefixed with a zero-padded sequence number so they sort in the
# order they were written: 0001_initial_schema.py, 0002_....
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]
# Format newly generated revisions. `exec` rather than `console_scripts` because the
# latter resolves entry points from Alembic's own distribution and cannot see ruff.
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
