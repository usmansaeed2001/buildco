# Local development database.
#
# Postgres runs here and is NOT installed on the host, so every contributor gets an
# identical setup with Docker as the only prerequisite.
#
#   docker compose up -d db      start (first run pulls the image)
#   docker compose down          stop and remove the container — DATA IS KEPT
#   docker compose down -v       ALSO DELETE THE DATA. The only destructive form.
#
# Nothing in this file is deployed; production runs on Cloud SQL.
# See docs/DATABASE.md.

services:
  db:
    image: postgres:16-alpine # matches the Cloud SQL target (POSTGRES_16)
    container_name: buildco-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: buildco
      POSTGRES_PASSWORD: buildco # local throwaway credentials, never reused anywhere
      POSTGRES_DB: buildco

    ports:
      # The standard port, because nobody on this project installs Postgres on the
      # host. If you do have one running locally, this bind will fail — or worse,
      # your client will reach the host server instead and report
      # "password authentication failed", which points nowhere near the real cause.
      # Fix it by stopping the host service rather than by changing this line, so
      # every contributor keeps the same connection string.
      - "5432:5432"

    volumes:
      # A named volume, so data outlives the container: `docker compose down` and
      # `up` again preserves everything.
      #
      # Named rather than a bind mount to a project folder on purpose. Postgres
      # requires specific ownership on its data directory, and bind mounts on Windows
      # and macOS do not reproduce that faithfully — the usual result is a container
      # that will not start. Docker-managed volumes behave the same on all platforms.
      - buildco-pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buildco -d buildco"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    # Mirrors the Cloud SQL instance flag, so connection-exhaustion bugs surface here
    # rather than in production. See the connection budget in docs/DATABASE.md.
    command: ["postgres", "-c", "max_connections=50"]

volumes:
  buildco-pgdata:
    name: buildco-pgdata
