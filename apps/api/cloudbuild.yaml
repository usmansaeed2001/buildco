# Cloud Build: API -> Cloud Run. Submitted by the Release workflow
# (.github/workflows/release.yml) for a commit on `main` whenever apps/api/** changed
# since the last release.
#
# Order is the point: check, then build, then migrate, then deploy. Each step's failure
# stops the ones after it, so a red test suite or a failed migration can never reach a
# serving revision. That matters more here than with a manual deploy, because a release
# now deploys with nobody watching the steps.
#
# Run it by hand against the current checkout with:
#   gcloud builds submit --config=apps/api/cloudbuild.yaml \
#     --substitutions=SHORT_SHA=$(git rev-parse --short HEAD),_VERSION=X.Y.Z .
#
# _VERSION is the release number without the `v`. It is baked into the image and reported
# by /livez; left out, the image reports the placeholder.
#
# The image reference is written out in full at each use rather than held in a
# substitution. Cloud Build does NOT expand substitutions recursively: a
# `_IMAGE: .../buildco-api:${SHORT_SHA}` entry is passed through verbatim and the build
# fails with `could not parse reference` on the literal `${SHORT_SHA}` text. Repetition
# is the price of it working.

steps:
  # ── Test database ───────────────────────────────────────────────────────────
  # A throwaway Postgres for the gate below, on the network every build step shares,
  # so the gate reaches it by name. It lives and dies with the build. The image matches
  # docker-compose.yml and the Cloud SQL target. The credentials guard nothing: the
  # database is empty, unreachable from outside the build, and gone when it ends.
  - id: test-db
    name: gcr.io/cloud-builders/docker
    args:
      - run
      - --detach
      - --name=buildco-test-db
      - --network=cloudbuild
      - --env=POSTGRES_USER=buildco
      - --env=POSTGRES_PASSWORD=buildco
      - --env=POSTGRES_DB=buildco_test
      - postgres:16-alpine
    waitFor: ['-']

  # ── Gate ────────────────────────────────────────────────────────────────────
  # Mirrors `make check`, then runs the suite a second time on Postgres as
  # `make test-pg` does. The image build does not run tests - the Dockerfile
  # deliberately excludes tests/ - so this is the only thing standing between a bad
  # merge and production.
  #
  # The second run is not a repeat. SQLite has no row locks and is loose about CHECK
  # constraints and JSON, so the tests marked `postgres` are skipped on it and a
  # constraint bug can hide there. Until this step existed those tests never ran before
  # a deploy at all.
  #
  # The wait is done in Python because this image has no `pg_isready`, and written
  # without a `$` because Cloud Build would read one as a substitution.
  - id: check
    name: python:3.12-slim
    dir: apps/api
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        pip install --quiet --root-user-action=ignore uv
        uv sync --frozen --group dev
        uv run ruff check .
        uv run mypy app
        uv run pytest -q

        uv run python -c "
        import asyncio, sys, asyncpg

        async def wait(url):
            for _ in range(30):
                try:
                    await (await asyncpg.connect(url, timeout=2)).close()
                    return
                except Exception:
                    await asyncio.sleep(2)
            sys.exit('The test database never came up.')

        asyncio.run(wait(sys.argv[1]))
        " postgresql://buildco:buildco@buildco-test-db:5432/buildco_test
        TEST_DATABASE_URL=postgresql+asyncpg://buildco:buildco@buildco-test-db:5432/buildco_test \
          uv run pytest -q
    waitFor: ['test-db']

  # ── Build ───────────────────────────────────────────────────────────────────
  # Tagged with the commit sha, never `latest`. That is what makes a rollback one
  # command and lets you tell which revision is actually running.
  - id: build
    name: gcr.io/cloud-builders/docker
    dir: apps/api
    args:
      - build
      - --build-arg
      - APP_VERSION=${_VERSION}
      - -t
      - us-central1-docker.pkg.dev/${PROJECT_ID}/buildco/buildco-api:${SHORT_SHA}
      - .
    waitFor: ['check']

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - us-central1-docker.pkg.dev/${PROJECT_ID}/buildco/buildco-api:${SHORT_SHA}
    waitFor: ['build']

  # ── Migrate ─────────────────────────────────────────────────────────────────
  # As a Cloud Run Job, not a build step talking to the database directly: the job has
  # the same Cloud SQL connectivity and the same service account as the app, so it
  # cannot succeed in an environment the app then fails in.
  #
  # --wait is load-bearing. Without it the command returns immediately and the deploy
  # below races a schema that may not exist yet.
  #
  # Migrations must stay backward-compatible with the currently deployed revision
  # (expand/contract) - see DEVELOPMENT_GUIDELINES.md §8. Traffic rollback is instant;
  # the database does not roll back with it.
  #
  # $$IMAGE, not $IMAGE: Cloud Build reads a single $ as its own substitution syntax and
  # would replace it with an empty string before bash ever sees the script.
  - id: migrate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMAGE="us-central1-docker.pkg.dev/${PROJECT_ID}/buildco/buildco-api:${SHORT_SHA}"
        gcloud run jobs update buildco-migrate --image="$$IMAGE" --region="${_REGION}" --quiet
        gcloud run jobs execute buildco-migrate --region="${_REGION}" --wait
    waitFor: ['push']

  # ── Deploy ──────────────────────────────────────────────────────────────────
  # Only the image is passed. `gcloud run deploy` on an existing service preserves every
  # setting it is not told to change, so env vars, secret bindings, the Cloud SQL
  # attachment, scaling and --no-cpu-throttling all survive.
  #
  # That is deliberate: it keeps secret names and infrastructure config out of the
  # repository, and means CI rolls the image and nothing else. The trade-off is that
  # changing an env var is a manual `gcloud run services update` - it will NOT happen by
  # editing this file. See DEPLOY_CLOUD_RUN.md §8 for the full deploy command.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMAGE="us-central1-docker.pkg.dev/${PROJECT_ID}/buildco/buildco-api:${SHORT_SHA}"
        gcloud run deploy buildco-api --image="$$IMAGE" --region="${_REGION}" --quiet
        gcloud run services describe buildco-api --region="${_REGION}" \
          --format='value(status.url)'
    waitFor: ['migrate']

  # ── Deploy the voice service ────────────────────────────────────────────────
  # BuildCo Assistant's WebSocket is served by a second Cloud Run service running this
  # same image (DEPLOY_CLOUD_RUN.md §8b). Rolling both from one build is what keeps it
  # one release: the API issues tickets that the voice service redeems, and the two
  # must agree about what a proposal is.
  #
  # The service is created by hand, once. Until it exists this step says so and passes,
  # so a build cannot fail over a service nobody has made yet.
  - id: deploy-agent
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMAGE="us-central1-docker.pkg.dev/${PROJECT_ID}/buildco/buildco-api:${SHORT_SHA}"
        if gcloud run services describe buildco-agent --region="${_REGION}" >/dev/null 2>&1; then
          gcloud run deploy buildco-agent --image="$$IMAGE" --region="${_REGION}" --quiet
        else
          echo "buildco-agent does not exist in ${_REGION} yet; nothing to roll."
        fi
    waitFor: ['migrate']

images:
  - us-central1-docker.pkg.dev/${PROJECT_ID}/buildco/buildco-api:${SHORT_SHA}

substitutions:
  _REGION: us-central1
  _VERSION: 0.0.0.dev0

options:
  # Required when the build runs as a service account without a user-owned logs bucket.
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 2400s
